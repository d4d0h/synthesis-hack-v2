<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="0" y2="630" stroke="white" stroke-width="1" transform="translate(60,0)" />
    <line x1="0" y1="0" x2="0" y2="630" stroke="white" stroke-width="1" transform="translate(120,0)" />
    <line x1="0" y1="0" x2="0" y2="630" stroke="white" stroke-width="1" transform="translate(180,0)" />
    <line x1="0" y1="0" x2="0" y2="630" stroke="white" stroke-width="1" transform="translate(240,0)" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="1" transform="translate(0,60)" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="1" transform="translate(0,120)" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="1" transform="translate(0,180)" />
  </g>

  <!-- Shield icon -->
  <g transform="translate(100, 140)">
    <path d="M50 0 L100 25 L100 65 C100 95 75 120 50 130 C25 120 0 95 0 65 L0 25 Z" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
    <path d="M35 65 L48 78 L70 50" fill="none" stroke="url(#green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="240" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white">TrustVault</text>
  <text x="240" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Open Trust Resolution Protocol for Agents</text>

  <!-- Divider -->
  <rect x="100" y="280" width="1000" height="2" fill="url(#accent)" opacity="0.3" rx="1"/>

  <!-- Two columns -->
  <!-- /resolve -->
  <g transform="translate(100, 320)">
    <rect width="460" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" font-family="monospace" font-size="18" font-weight="700" fill="#3b82f6">POST /resolve</text>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">Pre-task: "Should I cooperate?"</text>
    <text x="24" y="96" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Agent URL + task context</text>
    <text x="24" y="114" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">  TRUSTED / CAUTIOUS / UNTRUSTED / UNKNOWN</text>
    <text x="24" y="138" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">  Capability gap + Safeguards + Sybil check</text>
    <text x="24" y="162" font-family="system-ui, sans-serif" font-size="13" fill="#10b981">  + Signed receipt as proof</text>
  </g>

  <!-- /assure -->
  <g transform="translate(640, 320)">
    <rect width="460" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" font-family="monospace" font-size="18" font-weight="700" fill="#8b5cf6">POST /assure</text>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="15" fill="#e2e8f0">Post-task: "Can I trust the result?"</text>
    <text x="24" y="96" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Task output + performer + expected outcome</text>
    <text x="24" y="114" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">  ASSURED / FLAGGED / INSUFFICIENT_DATA</text>
    <text x="24" y="138" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">  6-check pipeline + AI verification</text>
    <text x="24" y="162" font-family="system-ui, sans-serif" font-size="13" fill="#10b981">  + Signed certificate as proof</text>
  </g>

  <!-- Bottom bar -->
  <rect x="100" y="530" width="1000" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="120" y="551" font-family="monospace" font-size="13" fill="#64748b">ERC-8004 Onchain Identity</text>
  <text x="380" y="551" font-family="monospace" font-size="13" fill="#64748b">Groq AI (Llama 3.3 70B)</text>
  <text x="620" y="551" font-family="monospace" font-size="13" fill="#64748b">Cloudflare Workers</text>
  <text x="840" y="551" font-family="monospace" font-size="13" fill="#64748b">Synthesis Hackathon 2026</text>

  <!-- Version badge -->
  <rect x="1020" y="155" width="80" height="28" rx="14" fill="url(#accent)" opacity="0.2"/>
  <text x="1060" y="174" font-family="monospace" font-size="14" fill="#93c5fd" text-anchor="middle">v2.2.0</text>
</svg>
